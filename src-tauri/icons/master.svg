        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom arrow ← emerald (Codex) -->
  <path d="M744 634 H344 L424 714"
        fill="none" stroke="#6ee7b7" stroke-width="72"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
